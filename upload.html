<section class="upload-section">

<h1>Upload Your Research Paper</h1>

<p>
Upload a PDF research paper and let AI generate
summaries, insights, and answer your questions.
</p>

<div class="upload-box">

<i class="fas fa-file-pdf"></i>

<h2>Drag & Drop PDF Here</h2>

<p>or</p>

<input type="file" id="fileInput" hidden>

<label for="fileInput" class="choose-btn">

Choose PDF

</label>

</div>

<button class="analyze-btn" onclick="startAnalysis()">

Analyze Paper

</button>

</section>

<div id="loading-screen">

<div class="loader"></div>

<h2>Analyzing Research Paper...</h2>

<p>Please wait while AI processes your document.</p>

</div>
